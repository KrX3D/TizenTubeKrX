<!DOCTYPE html>

<head>
    <style>
        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(25, 118, 210, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1976D2;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";

        // Earliest possible diagnostic hook — runs before the service is even
        // launched, so it can catch failures the service's own self-logging
        // never gets a chance to (e.g. launchAppControl's callback never
        // firing at all). Same /tv-log target and payload shape as the
        // service's own relayLog, so scripts/log-receiver/receiver.ps1 needs
        // no changes.
        function sendLog(level, message) {
            try {
                var ts = new Date().toISOString();
                fetch('http://192.168.50.57:3030/tv-log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        _formatted: '[' + ts + '] [' + level + '] [StandaloneIndexHtml] ' + message,
                        app: 'TizenTube Standalone',
                        ts: ts,
                        level: level,
                        context: 'StandaloneIndexHtml',
                        message: message
                    })
                }).catch(function () { });
            } catch (e) { }
        }

        sendLog('INFO', 'index.html script started');

        tizen.tvinputdevice.registerKey("ColorF0Red");
        tizen.tvinputdevice.registerKey("ColorF1Green");
        tizen.tvinputdevice.registerKey("ColorF2Yellow");
        tizen.tvinputdevice.registerKey("ColorF3Blue");

        const keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (let i = 0; i < keys.length; i++) {
            tizen.tvinputdevice.registerKey(keys[i]);
        }

        const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

        const serviceId = pkgId + ".StandaloneService";

        // Bounds the isConnecting poll below. Waiting is preferred over the proxy
        // path — the proxy rewrites YouTube's traffic, which is confirmed to
        // trigger verification challenges that stop playback (see README) — but
        // waiting forever is how a wedged isConnecting became a permanent splash
        // screen. Roughly 30s of patience, then take the degraded path rather
        // than none at all.
        var MAX_CONNECTING_POLLS = 30;
        var connectingPolls = 0;

        function useInjectorOrProxy() {
            sendLog('INFO', 'useInjectorOrProxy() called, fetching getState');
            const data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
            let args;
            try {
                const parsedData = JSON.parse(data[0].value[0]);
                args = parsedData.args;
            } catch (e) {
                // Do nothing.
            }
            fetch('http://localhost:8099/tizentube/getState')
                .then(r => r.json())
                .then(res => {
                    sendLog('INFO', 'getState resolved: ' + JSON.stringify(res));
                    if (res.canConnectToDaemon && !res.isConnecting) {
                        sendLog('INFO', 'Taking CDP-injection path, launching debugger and exiting');
                        fetch(`http://localhost:8099/tizentube/debugger${args ? `?${args}` : ''}`);
                        tizen.application.getCurrentApplication().exit();
                    } else if (!res.canConnectToDaemon) {
                        sendLog('INFO', 'Taking proxy path, navigating to localhost:8099/tv');
                        location.href = `http://localhost:8099/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8095%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`
                    } else if (connectingPolls < MAX_CONNECTING_POLLS) {
                        // canConnectToDaemon && isConnecting: a connection attempt is
                        // (or was) already in progress. Neither branch above matched,
                        // so previously this silently did nothing — a permanent hang
                        // whenever isConnecting got stuck true (e.g. a previous CDP
                        // attempt that never completed or failed, confirmed on-device).
                        // Poll rather than give up: injector.js times out a stuck
                        // attempt, so the usual outcome is the preferred CDP path.
                        connectingPolls++;
                        sendLog('INFO', 'canConnectToDaemon but isConnecting, retrying in 1s (' + connectingPolls + '/' + MAX_CONNECTING_POLLS + ')');
                        setTimeout(useInjectorOrProxy, 1000);
                    } else {
                        // Out of patience. isConnecting has stayed true well past
                        // injector.js's own give-up point, so nothing is coming —
                        // fall back to the proxy instead of sitting on the splash
                        // screen indefinitely, which is what this state used to do.
                        sendLog('ERROR', 'isConnecting still true after ' + MAX_CONNECTING_POLLS + ' polls, falling back to proxy path');
                        location.href = `http://localhost:8099/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8095%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`
                    }
                }).catch((err) => {
                    sendLog('ERROR', 'getState fetch failed, reloading: ' + (err && err.message || err));
                    window.location.reload();
                });
        }

        function launchService() {
            sendLog('INFO', 'Launching StandaloneService via launchAppControl');
            tizen.application.launchAppControl(
                new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
                serviceId,
                function () {
                    sendLog('INFO', 'launchAppControl success callback fired');
                    useInjectorOrProxy();
                },
                function (e) {
                    // Confirmed on-device: right after a TV reboot, this can
                    // genuinely fail (Tizen's own service-launch subsystem
                    // still warming up) — previously just showed an alert
                    // and stopped, unlike the getState-fetch-failure path
                    // below which already retries automatically. User had
                    // to manually close/reopen the app to get past it.
                    // Retry the same way instead.
                    sendLog('ERROR', 'launchAppControl failed, retrying in 1s: ' + e.message);
                    setTimeout(launchService, 1000);
                }
            );
        }
        launchService();
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1
        style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">
        TizenTube
    </h1>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>

</html>
